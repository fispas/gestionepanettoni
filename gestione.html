<!-- Box Kpi Incassi -->
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-bottom: 1.2rem;">
    <div style="background: var(--card-bg); padding: 1rem; border-radius: 16px; border: 2px solid var(--border-color); text-align: center;">
        <div style="font-size: 0.75rem; font-weight: 800; color: #2e7d32; font-family: 'Quicksand', sans-serif;">💶 INCASSATO TOTALE</div>
        <div style="font-size: 1.5rem; font-weight: 800; color: #2e7d32; margin-top: 2px;" id="lblIncassatoTotale">€ 0</div>
    </div>
    <div style="background: var(--card-bg); padding: 1rem; border-radius: 16px; border: 2px solid var(--border-color); text-align: center;">
        <div style="font-size: 0.75rem; font-weight: 800; color: #c53030; font-family: 'Quicksand', sans-serif;">⏳ DA INCASSARE</div>
        <div style="font-size: 1.5rem; font-weight: 800; color: #c53030; margin-top: 2px;" id="lblDaIncassareTotale">€ 0</div>
    </div>
</div>

<!-- Stock Section -->
<div class="stock-section">
    <div class="stock-card" id="cardStockPanettoni">
        <div class="stock-header">
            <span class="stock-title">🥮 Panettoni</span>
            <button class="admin-only" onclick="apriModaleStock('Panettoni')" style="background:none; border:none; cursor:pointer; font-size:0.8rem;">✏️</button>
        </div>
        <div style="display:flex; align-items:baseline; gap:6px; margin: 2px 0;">
            <span class="stock-main-val" id="valPanettoni">0</span>
            <span class="stock-sub-val" id="lblTotPanettoni">su 0</span>
        </div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="barPanettoni" style="width: 0%;"></div></div>
        <div style="font-size:0.75rem; color:var(--text-muted); font-weight:bold;" id="rimanenzePanettoni">Rimanenza: 0</div>
    </div>

    <div class="stock-card" id="cardStockPandori">
        <div class="stock-header">
            <span class="stock-title">🍞 Pandori</span>
            <button class="admin-only" onclick="apriModaleStock('Pandori')" style="background:none; border:none; cursor:pointer; font-size:0.8rem;">✏️</button>
        </div>
        <div style="display:flex; align-items:baseline; gap:6px; margin: 2px 0;">
            <span class="stock-main-val" id="valPandori">0</span>
            <span class="stock-sub-val" id="lblTotPandori">su 0</span>
        </div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="barPandori" style="width: 0%;"></div></div>
        <div style="font-size:0.75rem; color:var(--text-muted); font-weight:bold;" id="rimanenzePandori">Rimanenza: 0</div>
    </div>
</div>
