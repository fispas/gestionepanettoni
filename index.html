<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prenotazione Dolci Solidali - WonderLAD</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;750&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #6b9080;
            --primary-dark: #4d6a5b;
            --accent-soft: #a4c3b2;
            --accent-light: #eaf4f0;
            --bg-main: #f6fff8;
            --card-bg: #ffffff;
            --text-main: #2c3e35;
            --text-muted: #6b7c73;
            --border-color: #e2ece9;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header-bar {
            width: 100%;
            background-color: var(--card-bg);
            padding: 1.2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(107, 144, 128, 0.05);
            margin-bottom: 2rem;
            box-sizing: border-box;
        }
        .header-bar img { max-height: 48px; width: auto; }

        .form-container {
            background: var(--card-bg);
            max-width: 450px;
            width: 90%;
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(107, 144, 128, 0.08);
            border: 2px solid var(--border-color);
            box-sizing: border-box;
            margin-bottom: 3rem;
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
            font-weight: 750;
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
            font-family: 'Quicksand', sans-serif;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }

        input[type="text"], input[type="tel"], textarea {
            width: 100%;
            margin-bottom: 1.1rem;
            padding: 0.9rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fbfdfe;
            color: var(--text-main);
        }
        textarea { resize: vertical; min-height: 70px; }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(107, 144, 128, 0.12);
        }

        .product-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--accent-light);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .product-name { font-weight: 750; font-size: 1.1rem; color: var(--primary-dark); font-family: 'Quicksand', sans-serif; }
        .product-price { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
        .counter-group { display: flex; align-items: center; gap: 15px; }

        .btn-counter {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-counter:hover { background-color: var(--primary-dark); }
        .btn-counter:disabled { opacity: 0.35; cursor: not-allowed; }
        .count-display { font-size: 1.2rem; font-weight: 800; width: 28px; text-align: center; }

        .totale-riga {
            display: flex; justify-content: space-between; align-items: baseline;
            font-family: 'Quicksand', sans-serif; font-weight: 750;
            padding: 0.8rem 0 1.2rem; font-size: 1.1rem; color: var(--primary-dark);
        }
        .totale-riga strong { font-size: 1.5rem; }

        button[type="submit"] {
            width: 100%;
            padding: 1.1rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            box-shadow: 0 4px 12px rgba(107, 144, 128, 0.25);
        }
        button[type="submit"]:hover:enabled { background-color: var(--primary-dark); }
        button[type="submit"]:disabled { background-color: var(--accent-soft); cursor: not-allowed; box-shadow: none; }

        #statusMsg { font-weight: 700; text-align: center; margin-bottom: 1rem; font-family: 'Quicksand', sans-serif; }
        #statusMsg.errore { color: #c53030; }
        #statusMsg.ok { color: var(--primary); }

        .conferma-box {
            display: none;
            text-align: center;
            background: var(--accent-light);
            border: 2px solid var(--accent-soft);
            border-radius: 18px;
            padding: 1.5rem;
        }
        .conferma-box .codice {
            font-family: 'Quicksand', sans-serif;
            font-size: 2rem; font-weight: 800; letter-spacing: 3px;
            color: var(--primary-dark); margin: 0.5rem 0;
        }
        .btn-secondario {
            background: none; border: 2px solid var(--accent-soft); color: var(--primary-dark);
            padding: 0.7rem 1.2rem; border-radius: 12px; font-weight: 700; cursor: pointer;
            font-family: 'Quicksand', sans-serif; margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <img src="https://www.wonderlad.org/wp-content/uploads/2020/05/logo-wonderlad.png" alt="WonderLAD" onerror="this.style.display='none'">
    </div>

    <div class="form-container">
        <h2>Prenota i tuoi dolci</h2>
        <p class="subtitle">Sostieni i nostri progetti con dolcezza</p>

        <div id="statusMsg" role="status" aria-live="polite"></div>

        <div class="conferma-box" id="confermaBox">
            <div>Prenotazione registrata. Il tuo codice:</div>
            <div class="codice" id="codiceConferma"></div>
            <div style="font-size:0.9rem; color:var(--text-muted); font-weight:600;">
                Conservalo: ti servirà al ritiro. Ti contatteremo al numero indicato.
            </div>
            <button type="button" class="btn-secondario" id="btnNuovoOrdine">Prenota altri dolci</button>
        </div>

        <form id="ordineForm" novalidate>
            <label for="nome">Nome</label>
            <input type="text" id="nome" maxlength="60" autocomplete="given-name" required>

            <label for="cognome">Cognome</label>
            <input type="text" id="cognome" maxlength="60" autocomplete="family-name" required>

            <label for="telefono">Telefono</label>
            <input type="tel" id="telefono" inputmode="numeric" maxlength="15"
                   autocomplete="tel" placeholder="es. 3331234567" required>

            <div class="product-selector">
                <span>
                    <span class="product-name">Panettoni</span>
                    <span class="product-price" id="prezzoPanettoneLbl"></span>
                </span>
                <div class="counter-group">
                    <button type="button" class="btn-counter" data-prodotto="panettoni" data-delta="-1" aria-label="Togli un panettone">−</button>
                    <span id="panettoni-display" class="count-display">0</span>
                    <button type="button" class="btn-counter" data-prodotto="panettoni" data-delta="1" aria-label="Aggiungi un panettone">+</button>
                </div>
            </div>

            <div class="product-selector">
                <span>
                    <span class="product-name">Pandori</span>
                    <span class="product-price" id="prezzoPandoroLbl"></span>
                </span>
                <div class="counter-group">
                    <button type="button" class="btn-counter" data-prodotto="pandori" data-delta="-1" aria-label="Togli un pandoro">−</button>
                    <span id="pandori-display" class="count-display">0</span>
                    <button type="button" class="btn-counter" data-prodotto="pandori" data-delta="1" aria-label="Aggiungi un pandoro">+</button>
                </div>
            </div>

            <label for="note">Note (facoltative)</label>
            <textarea id="note" maxlength="300" placeholder="Es. ritiro il pomeriggio, consegna a…"></textarea>

            <div class="totale-riga">
                <span>Totale</span>
                <strong id="totaleOrdine">€ 0</strong>
            </div>

            <button type="submit" id="btnInvia">Conferma prenotazione</button>
        </form>
    </div>

    <script src="firebase-init.js"></script>
    <script>
        const MAX_PEZZI_PRODOTTO = 50;
        let config = { ...CONFIG_DEFAULT };
        let conteggi = { panettoni: 0, pandori: 0 };
        let invioInCorso = false;

        const el = (id) => document.getElementById(id);

        // ---- configurazione (prezzi / apertura prenotazioni) ----
        CONFIG_REF.get()
            .then(doc => { config = normalizzaConfig(doc.exists ? doc.data() : null); })
            .catch(() => { config = { ...CONFIG_DEFAULT }; })
            .finally(() => {
                el('prezzoPanettoneLbl').textContent = `€ ${config.prezzoPanettone} cad.`;
                el('prezzoPandoroLbl').textContent = `€ ${config.prezzoPandoro} cad.`;
                if (!config.ordiniAperti) {
                    el('ordineForm').style.display = 'none';
                    mostraMessaggio("Le prenotazioni sono chiuse. Grazie del sostegno!", 'errore');
                }
                aggiornaTotale();
            });

        function mostraMessaggio(testo, classe) {
            const m = el('statusMsg');
            m.textContent = testo;
            m.className = classe || '';
        }

        function aggiornaTotale() {
            const tot = conteggi.panettoni * config.prezzoPanettone + conteggi.pandori * config.prezzoPandoro;
            el('totaleOrdine').textContent = `€ ${tot.toLocaleString('it-IT')}`;
        }

        document.querySelectorAll('.btn-counter').forEach(btn => {
            btn.addEventListener('click', () => {
                const p = btn.dataset.prodotto;
                const delta = parseInt(btn.dataset.delta, 10);
                conteggi[p] = Math.max(0, Math.min(MAX_PEZZI_PRODOTTO, conteggi[p] + delta));
                el(p + '-display').textContent = conteggi[p];
                aggiornaTotale();
            });
        });

        function generaCodice() {
            const alfabeto = "ACDEFGHJKLMNPQRSTUVWXYZ23456789"; // niente caratteri ambigui
            let out = "";
            const buf = new Uint32Array(6);
            crypto.getRandomValues(buf);
            for (let i = 0; i < 6; i++) out += alfabeto[buf[i] % alfabeto.length];
            return out;
        }

        el('btnNuovoOrdine').addEventListener('click', () => {
            el('confermaBox').style.display = 'none';
            el('ordineForm').style.display = 'block';
            mostraMessaggio('', '');
        });

        el('ordineForm').addEventListener('submit', function (e) {
            e.preventDefault();
            if (invioInCorso) return;

            const nome = el('nome').value.trim();
            const cognome = el('cognome').value.trim();
            const telefono = el('telefono').value.replace(/\D/g, '');
            const note = el('note').value.trim();

            if (!nome || !cognome) return mostraMessaggio("Inserisci nome e cognome.", 'errore');
            if (!/^[0-9]{8,15}$/.test(telefono)) return mostraMessaggio("Inserisci un numero di telefono valido (solo cifre).", 'errore');
            if (conteggi.panettoni + conteggi.pandori < 1) return mostraMessaggio("Seleziona almeno un panettone o un pandoro.", 'errore');

            invioInCorso = true;
            const btn = el('btnInvia');
            btn.disabled = true;
            btn.textContent = "Invio in corso…";
            mostraMessaggio('', '');

            const codice = generaCodice();

            db.collection("ordini").add({
                nome: nome,
                cognome: cognome,
                telefono: telefono,
                panettoni: conteggi.panettoni,
                pandori: conteggi.pandori,
                note: note,
                codice: codice,
                status: "Prenotato - Da Pagare",
                metodoPagamento: "-",
                origine: "web",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                el('ordineForm').reset();
                conteggi = { panettoni: 0, pandori: 0 };
                el('panettoni-display').textContent = "0";
                el('pandori-display').textContent = "0";
                aggiornaTotale();

                el('codiceConferma').textContent = codice;
                el('ordineForm').style.display = 'none';
                el('confermaBox').style.display = 'block';
            })
            .catch(() => {
                mostraMessaggio("Non è stato possibile registrare la prenotazione. Riprova tra qualche istante.", 'errore');
            })
            .finally(() => {
                invioInCorso = false;
                btn.disabled = false;
                btn.textContent = "Conferma prenotazione";
            });
        });
    </script>
</body>
</html>
